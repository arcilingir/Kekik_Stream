# Bu araç @keyiflerolsun tarafından | @KekikAkademi için yazılmıştır.

name: KekikAkademi PyPI Yükleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - "pyproject.toml"

jobs:
  PyPIYukleyici:
    runs-on: ubuntu-latest

    # --- OIDC Güvenilir Yayınlama için Gerekli İzinler ---
    permissions:
      id-token: write  # PyPI OIDC token alabilmesi için zorunlu
      contents: read   # Depo içeriğini okuyabilmesi için zorunlu

    steps:
      - name: Depo Kontrolü
        uses: actions/checkout@v4

      - name: UV Kurulumu
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python Kurulumu
        run: uv python install 3.14

      - name: Paketi Derle (Build)
        run: uv build

      - name: PyPI'ye Yükle
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted Publishing kullandığınız için 'password' satırına gerek yoktur.
